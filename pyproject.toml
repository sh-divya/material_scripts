[tool.poetry]
name = "simoraclum"
version = "0.0.1"
description = "Simulation pipeline for relaxing candidates structures using mlff / dft"
authors = [
    "sh-divya <dsharm23@jh.edu>",
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
torch = ">=2.3.0"
torch-geometric = ">=2.5.3"
pyxtal = ">=0.6.7"
pymatgen = ">=2024.5.31"
lightning = ">=2.2.5"
scikit-learn = ">=1.5.0"
matgl = ">=1.1.1"
numpy = ">=1.26.4"
matplotlib = ">=3.8.4"
ase = ">=3.23.0"
pandas = ">=2.2.1"
mendeleev = ">=0.16.2"
tqdm = ">=4.66.4"
scipy = ">=1.13.0"
PyYAML = ">=6.0.1"
hydra-core = ">=1.3.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"